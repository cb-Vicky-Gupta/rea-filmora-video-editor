name: 🐛 Bug report
description: Something isn't working as expected
labels: [bug, needs triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please search [existing issues](../issues) first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a video
        2. Drag the Out slider to…
        3. Click Export
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Video file details
      description: Format, codec, resolution and length, if relevant.
      placeholder: MP4 (H.264), 1080p, 2 min
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or other context
